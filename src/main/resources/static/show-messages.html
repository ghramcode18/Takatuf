<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Chat Test</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>WebSocket Chat Test</h2>

<div>
  <label>Chat ID: <input type="text" id="chatId" value="1"></label><br>
  <label>Sender ID: <input type="text" id="senderId" value="1"></label><br>
  <label>Receiver ID: <input type="text" id="receiverId" value="2"></label><br>
  <label>Message: <input type="text" id="messageInput" value="Hello!"></label>
  <button onclick="sendMessage()">Send</button>
</div>

<hr>

<h3>Messages:</h3>
<ul id="messages"></ul>

<script>
        let stompClient = null;

        function connect() {
            const socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function () {
                const chatId = document.getElementById('chatId').value;

                stompClient.subscribe('/topic/chat/' + chatId, function (message) {
                    const msg = JSON.parse(message.body);
                    const item = document.createElement('li');
                    item.innerText = `[${msg.sender.id} → ${msg.receiver.id}]: ${msg.content}`;
                    document.getElementById('messages').appendChild(item);
                });

                console.log('Connected to WebSocket');
            });
        }

        function sendMessage() {
            const chatId = document.getElementById('chatId').value;
            const senderId = document.getElementById('senderId').value;
            const receiverId = document.getElementById('receiverId').value;
            const content = document.getElementById('messageInput').value;

            const payload = {
                chatId: parseInt(chatId),
                senderId: parseInt(senderId),
                receiverId: parseInt(receiverId),
                content: content
            };

            stompClient.send("/app/chat.send", {}, JSON.stringify(payload));
        }

        connect();
    </script>
</body>
</html>
