<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket Chat Test</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>WebSocket Chat Test</h2>

<input id="chatId" placeholder="Chat ID (مثلاً 1)" /><br />
<input id="senderId" placeholder="Sender ID" /><br />
<input id="receiverId" placeholder="Receiver ID" /><br />
<input id="content" placeholder="Message Content" /><br />
<button onclick="connect()">Connect</button>
<button onclick="sendMessage()">Send</button>

<h3>Received Messages:</h3>
<ul id="messages"></ul>

<script>
    let stompClient = null;

    function connect() {
      const socket = new SockJS("http://localhost:8080/ws");
      stompClient = Stomp.over(socket);

      stompClient.connect({}, function (frame) {
        console.log("Connected: " + frame);

        const chatId = document.getElementById("chatId").value;
        stompClient.subscribe("/topic/chat/" + chatId, function (message) {
          const msg = JSON.parse(message.body);
          const li = document.createElement("li");
          li.textContent = `[${msg.sender.name}]: ${msg.content}`;
          document.getElementById("messages").appendChild(li);
        });
      });
    }

    function sendMessage() {
      const payload = {
        chatId: parseInt(document.getElementById("chatId").value),
        senderId: parseInt(document.getElementById("senderId").value),
        receiverId: parseInt(document.getElementById("receiverId").value),
        content: document.getElementById("content").value
      };

      stompClient.send("/app/chat.send", {}, JSON.stringify(payload));
    }
  </script>
</body>
</html>
